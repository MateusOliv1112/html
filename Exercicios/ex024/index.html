<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iFrame</title>
    <style>
        iframe {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Testando uso de iframes</h1>
    <!-- Tamanho padrão do iframe é 300x150
        Pode ser laterada tendo da tag do iframe ou dentro da tag style, a preferencia é da tag style 
    -->
    <p>Acessando o site do 
        
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" width="500" scolling="no"></iframe>
        
        para aprender a programar.</p>

    <p>O repositório do Guanabara no 
        
        <iframe src="https://gustavoguanabara.github.io/" frameborder="0">
            <a href="https://gustavoguanabara.github.io/" target="_blank">Github</a>
        </iframe>

        também é bem legal</p>
</body>
</html>
