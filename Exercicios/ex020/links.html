<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {font-family: Arial, Helvetica, sans-serif;}
        a{color: red;
            text-decoration: none;
            font-weight: bold;}
        a:visited {
            color: darkred;
        }
        a:hover {
            text-decoration: underline;
            color: black;
        }
        a:active {
            color: green;
        }
        a::after {content: ' [link]';
                color: black;}
        .especial {
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://github.com/gustavoguanabara" target="_blank " rel="external">Repositório do GitHub</a></li>
        <li><a href="https://www.youtube.com/" class="especial" target="_blank " rel="external">Canal do Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com" target="_blank " rel="external">Site do curso em vídeo</a></li>
    </ul>
    
</body>
</html>
