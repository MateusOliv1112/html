<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixas</title>
    <style>
        h1 {
            background-color: lightgray;
            height: 80px;
            width: 282px;
            
            border: 10px solid darkolivegreen;

            padding: 10px;

            text-align: center;

            margin: 20px 10px 20px 10px;
            margin: auto;

            outline: 5px dashed salmon;
                    }
        a{
            border-width: 3px;
            border-style: double;
            border-color: red;
            padding: 3px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Paragráfos também são exemplos de de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
